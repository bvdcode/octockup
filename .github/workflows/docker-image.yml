name: CI

env:
  IMAGE_NAME: octockup
  CONTEXT_PATH: src
  SOURCES_PATH: Octockup.Server

on:
  push:
    paths:
      - "src/**"
      - ".github/workflows/**"
    branches:
      - main
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check repository
        uses: actions/checkout@v7
        with:
          lfs: "true"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/octockup.client/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/octockup.client
        run: npm ci

      - name: Check frontend
        working-directory: src/octockup.client
        run: |
          npm run lint
          npm run test
          npm run build

      - name: Test backend
        env:
          OCTOCKUP_TEST_POSTGRES_HOST: localhost
          OCTOCKUP_TEST_POSTGRES_PORT: 5432
          OCTOCKUP_TEST_POSTGRES_USERNAME: postgres
          OCTOCKUP_TEST_POSTGRES_PASSWORD: postgres
        run: dotnet test src/Octockup.Tests/Octockup.Tests.csproj --configuration Release -p:ShouldRunNpmInstall=false

  build:
    name: Build and Push Docker Image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      Version: ${{ steps.gitversion.outputs.MajorMinorPatch }}
      CommitsSinceVersionSource: ${{ steps.gitversion.outputs.CommitsSinceVersionSource }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check repository
        uses: actions/checkout@v7
        with:
          lfs: "true"
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: 6.x

      - name: Determine Version
        uses: gittools/actions/gitversion/execute@v4.7.0
        id: gitversion # step id used as reference for output values
      - name: Display GitVersion outputs
        run: |
          echo "Version: ${{ steps.gitversion.outputs.MajorMinorPatch }}"
          echo "CommitsSinceVersionSource: ${{ steps.gitversion.outputs.CommitsSinceVersionSource }}"

      - name: login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Build and push docker image to Docker Hub
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.CONTEXT_PATH }}
          push: true
          tags: |
            bvdcode/${{ env.IMAGE_NAME }}:latest
            bvdcode/${{ env.IMAGE_NAME }}:${{ steps.gitversion.outputs.MajorMinorPatch }}
          file: ${{ env.CONTEXT_PATH }}/${{ env.SOURCES_PATH }}/Dockerfile

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push docker image to GitHub Container Registry
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.CONTEXT_PATH }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.gitversion.outputs.MajorMinorPatch }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
          file: ${{ env.CONTEXT_PATH }}/${{ env.SOURCES_PATH }}/Dockerfile

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' # only run job if on the master branch
    steps:
      - name: Create Release
        if: needs.build.outputs.CommitsSinceVersionSource > 0
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ needs.build.outputs.Version }}
          name: Release ${{ needs.build.outputs.Version }}
          artifacts: "nupkg/*"
          token: ${{ secrets.GITHUB_TOKEN }}
